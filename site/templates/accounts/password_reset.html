{% extends "accounts/_auth.html" %}
{% block title %}Восстановление пароля | {{ site.name }}{% endblock %}
{% block h1 %}Восстановление пароля{% endblock %}
{% block body %}
<form method="post" class="panel" novalidate>
  {% csrf_token %}
  <p class="muted">Пришлём на email ссылку для нового пароля.</p>
  {% include "accounts/_form_fields.html" %}
  <button class="btn btn--primary btn--lg btn--block" type="submit">Прислать ссылку</button>
</form>
{% endblock %}
