{% extends "accounts/_auth.html" %}
{% block title %}Смена пароля | {{ site.name }}{% endblock %}
{% block h1 %}Смена пароля{% endblock %}
{% block body %}
<form method="post" class="panel" novalidate>
  {% csrf_token %}
  {% include "accounts/_form_fields.html" %}
  <button class="btn btn--primary btn--lg btn--block" type="submit">Сменить пароль</button>
</form>
<p class="auth__alt"><a class="link" href="{% url 'accounts:home' %}">← В личный кабинет</a></p>
{% endblock %}
